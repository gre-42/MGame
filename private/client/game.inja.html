<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" type="image/png" href="/client/favicon.png">
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #222;
        color: #fff;
      }
      #emscripten_border {
        width: 100vw;
        height: 100dvh;
        display: block;
        background: #000;
      }
      #canvas {
        width: 100vw;
        height: 100dvh;
        display: block;
      }
      #status {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); /* Perfectly centers the text */
        color: white;
        font-family: sans-serif;
        font-size: 18px;
        z-index: 10; /* Ensures text stays above the canvas layer */
        pointer-events: none; /* Allows mouse clicks to pass through to the canvas */
      }
    </style>
  </head>
  <body>
    <div class="emscripten_border">
      <div id="status">Downloading...</div>
      <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <script type="module">
      import createModule from '../game/RenderSceneFileActivity.js';
      import assetLoaderFactory from './assets_compressed.js';
      const statusElement = document.getElementById('status');
      const config = {
        preRun: (Module) => {
          assetLoaderFactory(Module);
        },
        print: text => {
          console.log(text);
        },
        printErr: text => {
          console.error(text);
        },
        setStatus: text => {
          if (text === '') {
            statusElement.style.display = 'none';
            statusElement.textContent = 'Loading finished';
          } else {
            statusElement.style.display = 'block';
            statusElement.textContent = text;
          }
        },
        canvas: document.getElementById('canvas'),
        arguments: [
          "compression/data;compression/dest/compressed;compression/dest/compressed.extended",
          "compression/dest/compressed/levels/main/main.scn.json",
          "--mesh", "obj.gz",
          "--animated_mesh", "mhx2.gz",
          "--audio", "mp3",
          "--compressed"],
        websocket: {
          url: 'ws://ws',
          subprotocol: 'binary'
        }
      };
      config.canvas.width = document.body.clientWidth;
      config.canvas.height = document.body.clientHeight;
      const params = new URLSearchParams(window.location.search);
      params.forEach((value, key) => {
        if (value === "" || value === "true" || value === "1") {
            config.arguments.push("--" + key);
        } else {
            config.arguments.push("--" + key);
            config.arguments.push(value);
        }
      });
      createModule(config).then((Module) => {
        console.log("WASM Module successfully initialized!");
      });
    </script>
  </body>
</html>
